name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Test installer
        run: sh scripts/test-install.sh
      - name: Verify crates.io package
        if: runner.os == 'Linux'
        run: cargo package --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: "1.88"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.88
      - name: Test minimum supported Rust version
        run: cargo test --locked --all-targets

  # A release is cut by merging a version bump into main: when Cargo.toml's
  # version has no tag yet, main builds and publishes it, creating the tag.
  # (A tag pushed with the workflow's own token would not start another run,
  # so publishing happens here rather than on a tag push.) Pull requests that
  # bump the version build every target too, without publishing.
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find an unreleased version
        id: version
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} is not released yet."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=${IS_MAIN_PUSH}" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    if: needs.version.outputs.build == 'true'
    needs: [test, msrv, version]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
            # Targets the runner executes natively get an install test of the
            # exact artifact being released.
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/dredge dredge-${{ matrix.target }}
      - name: Install and run the release artifact
        if: matrix.smoke
        run: DREDGE_INSTALL_TEST_BINARY="$PWD/dredge-${{ matrix.target }}" sh scripts/test-install.sh
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dredge-${{ matrix.target }}
          path: dredge-${{ matrix.target }}

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          find artifacts -type f -name 'dredge-*' -exec cp {} . \;
          sha256sum dredge-* > checksums.txt
      - name: Attest build provenance
        # GitHub stores attestations only for public repositories on a
        # personal account, so a private copy skips this step.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dredge-*
            checksums.txt
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The section runs from this version's heading to the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dredge ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          # Pre-releases (a version like 0.2.0-rc.1) must never become what
          # install.sh's releases/latest URL resolves to.
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: |
            dredge-*
            checksums.txt
