[package]
name = "dredge-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dredge contributors"]
description = "Local-first full-text search for Claude Code and Codex session history"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/cosmicbuffalo/dredge"
keywords = ["search", "claude", "codex", "transcripts", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[[bin]]
name = "dredge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5.54"
fs2 = "0.4.3"
levenshtein_automata = "0.2.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strsim = "0.11.1"
tantivy = "0.22.1"
tantivy-fst = "0.5.0"

[dev-dependencies]
tempfile = "3.20.0"
